version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # codeql-action init/analyze/upload-sarif must run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directories:
      - "/app"
      - "/worker"
    schedule:
      interval: "weekly"
